name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit:
    name: unit tests (fast, no Odoo)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install odoo-graph in editable mode
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest odoo_graph/tests/ -v

  e2e-smoke:
    name: E2E smoke (init base+mail, dump, snapshot-assert)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system deps for Odoo 17
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libxml2-dev libxslt1-dev libsasl2-dev libldap2-dev \
            libssl-dev libjpeg-dev libpq-dev python3-dev postgresql-client

      - name: Install odoo-graph + Odoo runtime deps
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e ".[dev]"
          # Odoo requirements but swap psycopg2 for psycopg2-binary (wheels everywhere)
          grep -v "^psycopg2==" odoo-17.0/requirements.txt > /tmp/reqs.txt
          pip install -r /tmp/reqs.txt
          pip install psycopg2-binary

      - name: Create Odoo database
        env:
          PGPASSWORD: odoo
        run: createdb -h 127.0.0.1 -U odoo -O odoo odoo_smoke

      - name: Init Odoo with minimal modules
        env:
          PGPASSWORD: odoo
        run: |
          PYTHONPATH=$(pwd)/odoo-17.0 python odoo-17.0/odoo-bin \
            -d odoo_smoke --db_host=127.0.0.1 --db_port=5432 -r odoo -w odoo \
            --init base,mail --stop-after-init --without-demo=all \
            --addons-path=odoo-17.0/addons --no-http --log-level=warn

      - name: Dump registry via odoo-graph
        env:
          PGPASSWORD: odoo
        run: |
          odoo-graph dump -d odoo_smoke \
            --odoo-path ./odoo-17.0 \
            --db-user odoo --db-password odoo \
            -f json > dump-result.json
          cat dump-result.json

      - name: Snapshot assertions on dump
        run: python -m odoo_graph.tests.snapshot_asserts dump-result.json

      - name: Run query commands end-to-end
        env:
          ODOO_GRAPH_DB: odoo_smoke
        run: |
          odoo-graph field res.partner.name -f json > /tmp/field.json
          python -c "import json; d=json.load(open('/tmp/field.json')); assert d['field']['name']=='name'; assert len(d['downstream']) > 0, d"

          odoo-graph model res.partner -f json > /tmp/model.json
          python -c "import json; d=json.load(open('/tmp/model.json')); assert 'mail' in d['extended_by_modules'], d['extended_by_modules']"

          odoo-graph module mail -f json > /tmp/module.json
          python -c "import json; d=json.load(open('/tmp/module.json')); assert len(d['original_models']) > 10, len(d['original_models'])"

          odoo-graph impact res.partner.name --max-depth 2 -f json > /tmp/impact.json
          python -c "import json; d=json.load(open('/tmp/impact.json')); assert len(d['impacted']) > 0, d"

          odoo-graph overrides res.users.write -f json > /tmp/ovr.json
          python -c "import json; d=json.load(open('/tmp/ovr.json')); assert d['override_depth'] >= 3, d"

      - name: Upload dump artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dump-smoke
          path: |
            ~/.cache/odoo-graph/
            dump-result.json
