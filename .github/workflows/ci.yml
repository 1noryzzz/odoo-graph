name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit:
    name: unit tests (fast, no Odoo)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install odoo-graph in editable mode
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest odoo_graph/tests/ -v

  fixture-smoke:
    name: Fixture dump smoke (query committed local_out)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install odoo-graph
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e ".[dev]"

      - name: Assert committed dump fixture exists
        run: |
          test -s registry-probe/local_out/nodes.jsonl
          test -s registry-probe/local_out/edges.jsonl
          test -s registry-probe/local_out/edges_resolved.jsonl
          test -s registry-probe/local_out/summary.json
          python -c "import json; s=json.load(open('registry-probe/local_out/summary.json')); assert s['models'] > 500, s; assert s['edges_delegates_to_model'] > 0, s"

      - name: Run query commands end-to-end
        run: |
          OUT_DIR=registry-probe/local_out
          mkdir -p fixture-query-output

          odoo-graph field ifs.gar.entry.supplier.vat --out-dir "$OUT_DIR" -f json > fixture-query-output/field.json
          python -c "import json; d=json.load(open('fixture-query-output/field.json')); a=d['analysis']; assert d['field']['name']=='vat'; assert a['kind']=='delegated_related', a; assert a['source_field']=='res.partner.vat', a; assert a['writable'] is True, a; assert len(a['delegation_chain']) >= 3, a"

          odoo-graph model ifs.gar.entry.supplier --out-dir "$OUT_DIR" -f json > fixture-query-output/model.json
          python -c "import json; d=json.load(open('fixture-query-output/model.json')); assert d['model']['name']=='ifs.gar.entry.supplier'; assert len(d['delegation_chain']) >= 3, d['delegation_chain']"

          odoo-graph module ifs_gar_entry --out-dir "$OUT_DIR" -f json > fixture-query-output/module.json
          python -c "import json; d=json.load(open('fixture-query-output/module.json')); assert len(d['original_models']) > 0, d"

          odoo-graph impact res.partner.vat --out-dir "$OUT_DIR" --max-depth 4 -f json > fixture-query-output/impact.json
          python -c "import json; d=json.load(open('fixture-query-output/impact.json')); assert len(d['impacted']) > 0, d"

          odoo-graph overrides res.users.write --out-dir "$OUT_DIR" -f json > fixture-query-output/ovr.json
          python -c "import json; d=json.load(open('fixture-query-output/ovr.json')); assert d['override_depth'] >= 3, d"

      - name: Upload fixture query outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-smoke
          path: |
            fixture-query-output/*.json
