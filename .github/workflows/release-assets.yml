name: release-assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build package + upload release assets
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release tag matches package version
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "Release tag ${RELEASE_TAG} does not match pyproject.toml version ${PACKAGE_VERSION}."
            echo "Expected tag: ${EXPECTED_TAG}"
            exit 1
          fi

      - name: Build Python package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Package runtime probe skill asset
        run: |
          mkdir -p dist
          zip -j dist/odoo-graph-runtime-probe-skill.zip skills/odoo-graph-runtime-probe/SKILL.md

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/odoo-graph-runtime-probe-skill.zip
